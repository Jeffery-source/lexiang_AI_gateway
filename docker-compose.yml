services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  gateway:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      - redis
    ports:
      - "8000:8000"

volumes:
  redis-data:
