[project]
name = "lexiang-ai-gateway"
version = "0.1.0"
description = "A credential-pooling gateway for Tencent Lexiang AI Q&A"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.6,<3",
  "redis>=5.2,<6",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = ["fakeredis>=2.26,<3", "pytest>=8.3,<9", "pytest-asyncio>=0.24,<1", "respx>=0.22,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
